# ============================================================
# Netlify — Sistema de Gestión Integral (Survisión S.A.)
# ============================================================
# Frontend estático (Vite). El sitio publicado lee SOLO Supabase: no hay
# ninguna llamada al backend Express, que corre on-premise porque necesita
# GECLISA (SQL Server en la red interna) y el disco local.
#
# POR QUÉ NO HAY PROXY DE /api
# ----------------------------
# Había un bloque que proxeaba /api/* a un túnel Cloudflare, pero su destino
# quedó en el placeholder `https://URL-DEL-TUNEL/...`: el túnel nunca se montó.
# Cualquier llamada a /api desde el sitio publicado terminaba en un host que no
# resuelve.
#
# Se sacó junto con su único consumidor, la Evolución Temporal del módulo
# Análisis (30/08/2026). Todo el resto del front —Análisis Marginal,
# Prestaciones Realizadas, Sueldos, Fiscal, Tesorería— lee Supabase directo.
#
# Si algún día se expone el backend, hay que volver a agregar el bloque ANTES
# del catch-all del SPA (Netlify usa el primer match) con status = 200 y
# force = true, para que sea un proxy server-side y no un redirect: así el
# navegador ve mismo origen, no hay CORS y el header Authorization llega.
# ============================================================

[build]
  command = "npm run build"   # tsc && vite build
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------------------------
# SPA: cualquier ruta sirve index.html (React Router del lado del cliente).
# ------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
